services:
  aegistrouter:
    build: .
    image: aegistrouter:latest
    container_name: aegistrouter
    restart: always
    ports:
      - "20200:20200"
    volumes:
      - aegistrouter-data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20200"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # INITIAL_PASSWORD: set via .env (INITIAL_PASSWORD=...) — never commit real passwords

volumes:
  aegistrouter-data:
    name: aegistrouter-data
